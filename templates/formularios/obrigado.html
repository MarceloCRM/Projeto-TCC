<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obrigado! | Acompanhamento de Egressos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --blue-900: #1e3a8a;
      --blue-700: #1d4ed8;
      --blue-200: #bfdbfe;
      --blue-50: #eff6ff;
    }

    body {
      background: var(--blue-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: #1f2937;
    }

    .caixa {
      background: #fff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 12px 40px rgba(30, 58, 138, 0.12);
    }

    .icone {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--blue-200);
      color: var(--blue-700);
      font-size: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-weight: 700;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--blue-900);
      margin-bottom: 0.75rem;
    }

    p {
      color: #6b7280;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <div class="icone">✓</div>

    <h2>Obrigado pela sua resposta!</h2>

    <p>
      Suas respostas foram registradas com sucesso.
      Sua contribuição é fundamental para melhorarmos
      continuamente nossos programas acadêmicos.
    </p>
  </div>
</body>
</html>
